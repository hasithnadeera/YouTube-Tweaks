<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- ─── Overview (default) ─────────────────────────────────────── -->
  <div id="view-overview">
    <header class="header">
      <div class="header-left">
        <img class="logo" src="icons/icon48.png" alt="" width="20" height="20">
        <h1>YouTube Tweaks</h1>
        <span class="version" id="ext-version"></span>
      </div>
      <button class="header-btn" id="btn-settings" type="button" aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M6.5 1.5h3l.4 1.6a4.5 4.5 0 0 1 1.3.75l1.55-.55 1.5 2.6-1.15 1.15c.1.35.15.7.15 1.05s-.05.7-.15 1.05l1.15 1.15-1.5 2.6-1.55-.55a4.5 4.5 0 0 1-1.3.75L9.5 14.5h-3l-.4-1.6a4.5 4.5 0 0 1-1.3-.75l-1.55.55-1.5-2.6 1.15-1.15A4.6 4.6 0 0 1 2.75 8c0-.35.05-.7.15-1.05L1.75 5.8l1.5-2.6 1.55.55a4.5 4.5 0 0 1 1.3-.75L6.5 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
    </header>

    <section class="overview">
      <div class="hero">
        <div class="hero-top">
          <span class="hero-label">Time saved</span>
          <button class="stats-reset" id="stats-reset" type="button">Reset</button>
        </div>
        <div class="hero-value" id="stats-time">—</div>
        <div class="hero-sub" id="stats-count"></div>
      </div>

      <div class="analytics" id="analytics">
        <div class="analytics-block" id="channel-block" hidden>
          <div class="analytics-heading">
            <h2 class="group-label">Most sponsored channels</h2>
            <button class="link-btn" id="btn-analytics" type="button">Full analytics</button>
          </div>
          <div class="channel-list" id="channel-list"></div>
        </div>
        <button class="link-btn link-btn-block" id="btn-analytics-empty" type="button" hidden>
          Full analytics
        </button>
      </div>
    </section>
  </div>

  <!-- ─── Settings (gear icon) ───────────────────────────────────── -->
  <div id="view-settings" hidden>
    <header class="header">
      <div class="header-left">
        <button class="header-btn" id="btn-back" type="button" aria-label="Back" title="Back">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3.5 5.5 8 10 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1>Settings</h1>
      </div>
    </header>

    <section class="group">
      <h2 class="group-label">Player</h2>

      <div class="row">
        <div class="row-info"><span class="title">Speed selector</span></div>
        <label class="switch">
          <input type="checkbox" id="toggle-speed">
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <div class="row-info">
          <span class="title">Center player</span>
          <span class="desc">Hides suggestions, centers the video</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-layout">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="group">
      <h2 class="group-label">Clean up</h2>

      <div class="row">
        <div class="row-info"><span class="title">Hide Shorts</span></div>
        <label class="switch">
          <input type="checkbox" id="toggle-shorts">
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <div class="row-info">
          <span class="title">Hide actions</span>
          <span class="desc">Removes like &amp; share, keeps Save</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-actions">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="group">
      <h2 class="group-label">SponsorBlock</h2>

      <div class="row">
        <div class="row-info">
          <span class="title">Skip sponsors</span>
          <span class="desc">Community-flagged, skipped automatically</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-sponsors">
          <span class="slider"></span>
        </label>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
