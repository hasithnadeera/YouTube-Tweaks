<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowPlay</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <nav class="flow-nav" aria-label="FlowPlay areas">
      <a href="../popup.html">YouTube</a>
      <span class="active" aria-current="page">Websites</span>
      <a href="../options/options.html" target="_blank">All settings</a>
    </nav>
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="">
        <div>
          <p class="eyebrow">FlowPlay</p>
          <h1 id="hostname">Current website</h1>
        </div>
      </div>
      <span id="scope-badge" class="badge">Loading</span>
    </header>

    <section id="restricted-card" class="notice" hidden>
      Your browser protects this page from extensions. Open a regular website to use FlowPlay controls.
    </section>

    <section id="controls" class="card controls" aria-label="Website controls">
      <div class="setting-row master-row">
        <div class="setting-copy">
          <label for="site-enabled">FlowPlay on this site</label>
          <p>Exact hostname only</p>
        </div>
        <label class="switch"><input id="site-enabled" type="checkbox"><span></span></label>
      </div>

      <div class="setting-row">
        <div class="setting-copy"><label for="scrollbar-enabled">Slim scrollbar</label></div>
        <label class="switch"><input id="scrollbar-enabled" type="checkbox"><span></span></label>
      </div>

      <div class="setting-row">
        <div class="setting-copy"><label for="scrollbar-autohide">Auto-hide when idle</label></div>
        <label class="switch"><input id="scrollbar-autohide" type="checkbox"><span></span></label>
      </div>

    </section>

    <footer class="popup-footer">
      <button id="reset-site" type="button">Use global defaults</button>
      <button id="open-options" class="primary" type="button">Advanced settings</button>
    </footer>
    <p id="status" class="status-message" role="status" aria-live="polite"></p>
  </main>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
