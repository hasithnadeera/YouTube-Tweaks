<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowPlay</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell"><nav aria-label="Features"><a href="../popup.html">YouTube controls</a> · <span>Website controls</span></nav>
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="">
        <div>
          <p class="eyebrow">FlowPlay</p>
          <h1 id="hostname">Current website</h1>
        </div>
      </div>
      <span id="scope-badge" class="badge">Loading</span>
    </header>

    <section id="restricted-card" class="notice" hidden>
      Brave protects this page from extensions. Open a regular HTTP or HTTPS website to use Powerhouse.
    </section>

    <section id="controls" class="card controls" aria-label="Website controls">
      <div class="setting-row master-row">
        <div class="setting-copy">
          <label for="site-enabled">Powerhouse on this site</label>
          <p>Exact hostname only</p>
        </div>
        <label class="switch"><input id="site-enabled" type="checkbox"><span></span></label>
      </div>

      <div class="setting-row">
        <div class="setting-copy"><label for="scrollbar-enabled">Slim scrollbar</label></div>
        <label class="switch"><input id="scrollbar-enabled" type="checkbox"><span></span></label>
      </div>

      <div class="setting-row">
        <div class="setting-copy"><label for="scrollbar-autohide">Auto-hide when idle</label></div>
        <label class="switch"><input id="scrollbar-autohide" type="checkbox"><span></span></label>
      </div>

      <div class="setting-row stacked">
        <div class="setting-copy"><label for="dimmer-enabled">Page dimmer</label></div>
        <label class="switch"><input id="dimmer-enabled" type="checkbox"><span></span></label>
        <div class="range-row">
          <input id="dimmer-amount" type="range" min="0" max="30" step="1">
          <output id="dimmer-output" for="dimmer-amount">10%</output>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-copy">
          <label for="focus-enabled">Focus Mode</label>
          <p>Hide page chrome and distractions</p>
        </div>
        <label class="switch"><input id="focus-enabled" type="checkbox"><span></span></label>
      </div>

      <div class="setting-row">
        <div class="setting-copy"><label for="motion-mode">Motion</label></div>
        <select id="motion-mode">
          <option value="system">Follow system</option>
          <option value="reduce">Reduce motion</option>
          <option value="normal">Allow motion</option>
        </select>
      </div>
    </section>

    <footer class="popup-footer">
      <button id="reset-site" type="button">Use global defaults</button>
      <button id="open-options" class="primary" type="button">Advanced settings</button>
    </footer>
    <p id="status" class="status-message" role="status" aria-live="polite"></p>
  </main>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
