<svg xmlns="http://www.w3.org/2000/svg" width="320" height="700" viewBox="0 0 320 700" fill="none">
  <title>YouTube Tweaks  Popup UI Mockup</title>
  <desc>Overview dashboard with time saved hero, category breakdown, top 5 channels. Gear opens Settings.</desc>
  <defs>
    <style>
      .bg { fill: #181818; }
      .surface { fill: #212121; }
      .border { stroke: #303030; }
      .text { fill: #f1f1f1; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .text-dim { fill: #aaaaaa; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .text-faint { fill: #777777; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .accent { fill: #ff0000; }
      .chip-bg { fill: #2c2c2c; }
    </style>
  </defs>

  <!-- Overview -->
  <rect width="320" height="560" class="bg"/>
  <rect x="0" y="0" width="320" height="44" class="surface"/>
  <line x1="0" y1="44" x2="320" y2="44" class="border" stroke-width="1"/>
  <rect x="16" y="12" width="20" height="20" rx="5" class="accent"/>
  <path d="M23 17 L30 22 L23 27 Z" fill="#fff"/>
  <text x="44" y="27" class="text" font-size="13" font-weight="600">YouTube Tweaks</text>
  <rect x="276" y="10" width="24" height="24" rx="6" class="chip-bg"/>
  <circle cx="288" cy="22" r="5.5" stroke="#aaa" stroke-width="1.4" fill="none"/>
  <circle cx="288" cy="22" r="1.8" fill="#aaa"/>

  <rect x="16" y="58" width="288" height="88" rx="12" class="surface"/>
  <rect x="16" y="58" width="288" height="88" rx="12" stroke="#303030" stroke-width="1" fill="none"/>
  <text x="32" y="82" class="text-faint" font-size="10" font-weight="700" letter-spacing="0.08em">TIME SAVED</text>
  <text x="288" y="82" class="text-faint" font-size="11" text-anchor="end">Reset</text>
  <text x="32" y="118" class="text" font-size="34" font-weight="700">1h 58m</text>
  <text x="32" y="138" class="text-dim" font-size="12">142 segments skipped</text>

  <text x="16" y="172" class="text-faint" font-size="10" font-weight="700" letter-spacing="0.07em">BY CATEGORY</text>
  <circle cx="24" cy="196" r="4" fill="#00d400"/>
  <text x="36" y="200" class="text" font-size="12" font-weight="500">Sponsor</text>
  <text x="304" y="200" class="text-dim" font-size="11" text-anchor="end">1h 12m</text>
  <rect x="16" y="208" width="288" height="6" rx="3" class="chip-bg"/>
  <rect x="16" y="208" width="176" height="6" rx="3" fill="#00d400"/>

  <circle cx="24" cy="236" r="4" fill="#ffff00"/>
  <text x="36" y="240" class="text" font-size="12" font-weight="500">Self-promo</text>
  <text x="304" y="240" class="text-dim" font-size="11" text-anchor="end">28m</text>
  <rect x="16" y="248" width="288" height="6" rx="3" class="chip-bg"/>
  <rect x="16" y="248" width="69" height="6" rx="3" fill="#ffff00"/>

  <circle cx="24" cy="276" r="4" fill="#00ffff"/>
  <text x="36" y="280" class="text" font-size="12" font-weight="500">Intro</text>
  <text x="304" y="280" class="text-dim" font-size="11" text-anchor="end">12m</text>
  <rect x="16" y="288" width="288" height="6" rx="3" class="chip-bg"/>
  <rect x="16" y="288" width="29" height="6" rx="3" fill="#00ffff"/>

  <circle cx="24" cy="316" r="4" fill="#0202ed"/>
  <text x="36" y="320" class="text" font-size="12" font-weight="500">Outro</text>
  <text x="304" y="320" class="text-dim" font-size="11" text-anchor="end">8m</text>
  <rect x="16" y="328" width="288" height="6" rx="3" class="chip-bg"/>
  <rect x="16" y="328" width="20" height="6" rx="3" fill="#0202ed"/>

  <circle cx="24" cy="356" r="4" fill="#7300ff"/>
  <text x="36" y="360" class="text" font-size="12" font-weight="500">Filler</text>
  <text x="304" y="360" class="text-dim" font-size="11" text-anchor="end">6m</text>
  <rect x="16" y="368" width="288" height="6" rx="3" class="chip-bg"/>
  <rect x="16" y="368" width="15" height="6" rx="3" fill="#7300ff"/>

  <text x="16" y="400" class="text-faint" font-size="10" font-weight="700" letter-spacing="0.07em">MOST SPONSORED CHANNELS</text>
  <text x="16" y="424" class="text-faint" font-size="11" font-weight="600">1</text>
  <circle cx="36" cy="420" r="11" class="chip-bg"/>
  <text x="56" y="424" class="text" font-size="12" font-weight="500">Linus Tech Tips</text>
  <text x="304" y="424" class="text-dim" font-size="11" text-anchor="end">42m</text>
  <rect x="56" y="430" width="248" height="4" rx="2" class="chip-bg"/>
  <rect x="56" y="430" width="168" height="4" rx="2" fill="#00d400"/>

  <text x="16" y="456" class="text-faint" font-size="11" font-weight="600">2</text>
  <circle cx="36" cy="452" r="11" class="chip-bg"/>
  <text x="56" y="456" class="text" font-size="12" font-weight="500">MKBHD</text>
  <text x="304" y="456" class="text-dim" font-size="11" text-anchor="end">28m</text>
  <rect x="56" y="462" width="248" height="4" rx="2" class="chip-bg"/>
  <rect x="56" y="462" width="112" height="4" rx="2" fill="#00d400"/>

  <text x="16" y="488" class="text-faint" font-size="11" font-weight="600">3</text>
  <circle cx="36" cy="484" r="11" class="chip-bg"/>
  <text x="56" y="488" class="text" font-size="12" font-weight="500">Veritasium</text>
  <text x="304" y="488" class="text-dim" font-size="11" text-anchor="end">18m</text>
  <rect x="56" y="494" width="248" height="4" rx="2" class="chip-bg"/>
  <rect x="56" y="494" width="72" height="4" rx="2" fill="#00d400"/>

  <text x="16" y="520" class="text-faint" font-size="11" font-weight="600">4</text>
  <circle cx="36" cy="516" r="11" class="chip-bg"/>
  <text x="56" y="520" class="text" font-size="12" font-weight="500">LTT Shorts</text>
  <text x="304" y="520" class="text-dim" font-size="11" text-anchor="end">12m</text>
  <rect x="56" y="526" width="248" height="4" rx="2" class="chip-bg"/>
  <rect x="56" y="526" width="48" height="4" rx="2" fill="#00d400"/>

  <text x="16" y="552" class="text-faint" font-size="11" font-weight="600">5</text>
  <circle cx="36" cy="548" r="11" class="chip-bg"/>
  <text x="56" y="552" class="text" font-size="12" font-weight="500">Fireship</text>
  <text x="304" y="552" class="text-dim" font-size="11" text-anchor="end">8m</text>
  <rect x="56" y="558" width="248" height="4" rx="2" class="chip-bg"/>
  <rect x="56" y="558" width="32" height="4" rx="2" fill="#00d400"/>

  <!-- Settings strip -->
  <rect x="0" y="570" width="320" height="18" fill="#0d0d0d"/>
  <text x="160" y="583" fill="#555" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" letter-spacing="0.08em">SETTINGS (GEAR)</text>

  <rect y="588" width="320" height="112" class="bg"/>
  <rect x="0" y="588" width="320" height="44" class="surface"/>
  <line x1="0" y1="632" x2="320" y2="632" class="border" stroke-width="1"/>
  <rect x="12" y="598" width="24" height="24" rx="6" class="chip-bg"/>
  <path d="M26 604 L18 610 L26 616" stroke="#aaa" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="44" y="615" class="text" font-size="13" font-weight="600">Settings</text>
  <text x="16" y="652" class="text-faint" font-size="10" font-weight="700" letter-spacing="0.07em">PLAYER</text>
  <text x="16" y="674" class="text" font-size="12" font-weight="500">Speed selector</text>
  <rect x="270" y="662" width="34" height="19" rx="9.5" class="accent"/>
  <circle cx="295" cy="671.5" r="7.5" fill="#fff"/>
</svg>
